# Configuracao minima de desenvolvimento.
# O alvo e' o servico `app` do docker-compose. Se preferir rodar a aplicacao no
# host, troque por host.docker.internal:8000 (resolvido via `extra_hosts`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: django
    # exposto por django_prometheus quando ENABLE_PROMETHEUS=true
    metrics_path: /monitoring/metrics
    static_configs:
      - targets: ["app:8000"]
