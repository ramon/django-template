{# Não delega a <c-ui.*> — não está no vocabulário genérico de apps/ui (ver ADR 0013). #}
{% load allauth %}
<details {% if attrs.open %}open{% endif %} class="border-outline-variant mt-6 rounded-lg border p-4">
    <summary class="text-on-surface cursor-pointer text-sm font-medium">
        {% slot summary %}
        {% endslot %}
    </summary>
    <div class="mt-4">
        {% slot body %}
        {% endslot %}
    </div>
</details>
