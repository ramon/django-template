services:
  kv-database:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    volumes:
      - kv-data:/data
  database:
    image: postgres:18-alpine
    shm_size: 256mb
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
  prometheus:
    # linha LTS do Prometheus 3.x
    image: prom/prometheus:v3.5.5
    ports:
      - "9090:9090"
    volumes:
      - ./tools/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # permite raspar a app Django rodando no host, fora do compose
      - "host.docker.internal:host-gateway"



volumes:
  kv-data:
    driver: local
  db-data:
    driver: local
  prometheus-data:
    driver: local