name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # settings do Django exigem SECRET_KEY sem default; valor descartavel de CI
  SECRET_KEY: ci-secret-key-not-used-in-production
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      # espelham docker-compose.yml
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kv-database:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/app
      CACHE_URL: redis://127.0.0.1:6379/0
      SESSION_CACHE_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: django check (development)
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DEBUG: "True"

      - name: django check (production)
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production

      - name: django check (production + prometheus)
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ENABLE_PROMETHEUS: "True"

      - name: migrations em dia
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DEBUG: "True"

      - name: gettext
        run: command -v msgfmt >/dev/null || (sudo apt-get update && sudo apt-get install -y gettext)

      - name: catalogos em dia
        # makemessages e' idempotente aqui (sem location, sem obsoletas e sem
        # POT-Creation-Date), entao qualquer diff significa catalogo desatualizado
        run: |
          uv run python manage.py makemessages
          git diff --exit-code -- '*.po' || {
            echo "::error::rode 'manage.py makemessages' e comite os catalogos"
            exit 1
          }
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DEBUG: "True"

      - name: compilar catalogos
        run: uv run python manage.py compilemessages

      - name: pytest
        run: uv run pytest --cov=apps --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: lint (biome em js/css, stylelint para BEM)
        run: bun run lint

      - name: vitest com cobertura
        run: bun run test:coverage

      - name: vite build
        run: bun run build

      - name: manifest gerado onde o templatetag procura
        run: test -f static/dist/.vite/manifest.json

  e2e:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kv-database:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/app
      CACHE_URL: redis://127.0.0.1:6379/0
      SESSION_CACHE_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --frozen
      - run: bun install --frozen-lockfile

      - name: build do frontend
        # os templates resolvem os assets pelo manifest do Vite fora de DEBUG
        run: bun run build

      - name: instalar o browser
        run: uv run playwright install --with-deps chromium

      - name: pytest -m e2e
        run: uv run pytest -m e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kv-database:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: build da imagem de producao
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: nenhuma ferramenta de build sobreviveu
        run: |
          for cmd in uv bun node npm gcc; do
            if docker run --rm --entrypoint sh app:ci -c "command -v $cmd" >/dev/null 2>&1; then
              echo "::error::$cmd sobrou na imagem final"
              exit 1
            fi
          done

      - name: nenhuma dependencia de dev sobreviveu
        run: |
          vazou=$(docker run --rm --entrypoint sh app:ci \
            -c 'ls .venv/lib/python*/site-packages | grep -iE "^(pytest|mypy|ruff|debug_toolbar|factory|faker|playwright|coverage)"' || true)
          if [ -n "$vazou" ]; then
            echo "::error::dependencias de dev na imagem: $vazou"
            exit 1
          fi

      - name: a imagem sobe e responde
        # espelha o Procfile: release migra, web serve. O X-Forwarded-Proto imita o
        # proxy TLS -- sem ele o SECURE_SSL_REDIRECT devolve 301.
        run: |
          docker run --rm --network host -e SECRET_KEY=ci $ENVS app:ci \
            python manage.py migrate --noinput

          docker run -d --name app --network host -e SECRET_KEY=ci -e ALLOWED_HOSTS='*' $ENVS app:ci

          for _ in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs app
          test "$code" = "200"
        env:
          ENVS: >-
            -e DATABASE_URL=postgres://user:password@127.0.0.1:5432/app
            -e CACHE_URL=redis://127.0.0.1:6379/0
            -e SESSION_CACHE_URL=redis://127.0.0.1:6379/1

      - name: build da imagem de desenvolvimento
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy apps tests
