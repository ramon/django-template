[project]
name = "django-template"
version = "0.1.0"
description = "Base template for Django projects with Django"
authors = [{name="Ramon", email="dev@ramon.dev.br"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.6.3",
    "django>=6.0,<6.1",
    "django-allauth[mfa,socialaccount]>=65.17",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-cors-headers>=4.9",
    "django-cotton>=2.7",
    "django-environ>=0.13",
    "django-guid>=3.6.1",
    "django-health-check>=4.4",
    "django-ninja>=1.6",
    "django-prometheus>=2.5.0",
    "django-storages>=1.14",
    "django-structlog>=10.0.0",
    "gunicorn>=26.0.0",
    "orjson>=3.11.9",
    "phonenumbers>=9.0.31",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3",
    "pydantic>=2.0,<3.0",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.1",
    "redis[hiredis]>=6.4",
    "sentry-sdk[django]>=2.60",
    "servestatic[brotli,minify]>=4.3.0",
    "structlog>=25.5.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.48.0",
]

[project.optional-dependencies]
# boto3 + botocore custam 31 MB; so entram em quem usa storage remoto de fato.
#   uv sync --extra s3
s3 = ["django-storages[s3]>=1.14"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "coverage>=7.14.1",
    "django-debug-toolbar>=6.3.0",
    "django-extensions>=4.1",
    "django-stubs[compatible-mypy]>=6.0.4",
    "factory-boy>=3.3",
    "faker>=40.19.1",
    "ipython>=9.13.0",
    "mypy>=2.1",
    "pre-commit>=4.6",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "node_modules",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "ARG",
    "PIE",
    "RET",
    "RUF",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Django declara list_display/fieldsets/ordering como atributos de classe mutaveis
# por design; RUF012 e' falso-positivo aqui.
"**/admin.py" = ["RUF012"]
"**/models/*.py" = ["RUF012"]
"**/models/**/*.py" = ["RUF012"]
# assinaturas impostas por override (Model.delete, ninja BaseRenderer.render)
"apps/core/models/mixins/soft_delete.py" = ["ARG002"]
"config/urls/api.py" = ["ARG002"]
# factory_boy chama _create(model_class, *args, **kwargs); o *args faz parte do contrato
"apps/*/tests/factories.py" = ["ARG003"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["apps"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]
addopts = [
    "--reuse-db",
    "--strict-markers",
    "--strict-config",
    # e2e exigem browser e build do frontend; rode com `pytest -m e2e`
    "-m",
    "not e2e",
]
markers = [
    "e2e: teste ponta a ponta, roda num browser real via Playwright",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
check_untyped_defs = true
pretty = true
exclude = [
    "apps/.*/migrations/.*",
    "config/.*",
    "docs/.*",
    "scripts/.*"
]
plugins = [
    "mypy_django_plugin.main"
]

# @computed_field sobre @property e' o padrao do Pydantic v2 nos value objects;
# o mypy nao suporta decorator sobre property e reporta prop-decorator sempre.
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
# os testes vivem em apps.<app>.tests, nao num pacote tests/ na raiz
module = [
    "apps.*.tests.*",
    "tests.*",
    "conftest",
]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# ModelAdmin e UserAdmin sao genericos para o django-stubs, mas nao definem
# __class_getitem__: parametriza-los quebra o import em runtime.
module = [
    "apps.*.admin",
]
disallow_any_generics = false

[[tool.mypy.overrides]]
# as declaracoes do factory_boy (Faker, Sequence, SubFactory, Iterator) tem
# __init__ sem anotacao; so as factories chamam essas classes
module = [
    "apps.*.tests.factories",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# o factory_boy tem py.typed, mas o __init__ reexporta sem __all__
module = [
    "factory",
    "factory.*",
]
no_implicit_reexport = false

[[tool.mypy.overrides]]
# dependencias sem stubs nem marcador py.typed
module = [
    "allauth.*",
    "environ.*",
    "health_check.*",
    "phonenumbers.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.development"
