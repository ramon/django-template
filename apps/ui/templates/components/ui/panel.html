<c-vars title="" />

<section {{ attrs }} class="border-outline-variant bg-surface-container-low rounded-xl border p-6">
    {% if title %}
        <h2 class="text-on-surface mb-4 text-lg font-semibold">{{ title }}</h2>
    {% endif %}
    {{ slot }}
    {% if actions %}
        <div class="mt-6 flex flex-wrap items-center gap-3">{{ actions }}</div>
    {% endif %}
</section>
