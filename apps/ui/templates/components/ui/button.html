{% comment %}
Botão de ação. `href` presente renderiza <a> no lugar de <button> (CTA que navega).
`variant` = ênfase (prominent/outline/link); `color` = cor semântica (primary/secondary/danger).
{% endcomment %}
<c-vars variant="prominent" color="primary" type="button" href="" class="" :styles="{'prominent-primary': 'bg-primary text-on-primary hover:opacity-90', 'prominent-secondary': 'bg-secondary text-on-secondary hover:opacity-90', 'prominent-danger': 'bg-error text-on-error hover:opacity-90', 'outline-primary': 'border border-primary text-primary hover:bg-primary-container', 'outline-secondary': 'border border-secondary text-secondary hover:bg-secondary-container', 'outline-danger': 'border border-error text-error hover:bg-error-container', 'link-primary': 'text-primary underline-offset-4 hover:underline', 'link-secondary': 'text-primary underline-offset-4 hover:underline', 'link-danger': 'text-error underline-offset-4 hover:underline'}" />

{% with key=variant|add:"-"|add:color %}
    {% if href %}
        <a href="{{ href }}"
           {{ attrs }}
           class="inline-flex items-center justify-center gap-2 rounded-lg px-3 py-1.5 text-sm font-medium transition {{ styles|get_item:key }} {{ class }}">{{ slot }}</a>
    {% else %}
        <button type="{{ type }}"
                {{ attrs }}
                class="inline-flex items-center justify-center gap-2 rounded-lg px-3 py-1.5 text-sm font-medium transition disabled:pointer-events-none disabled:opacity-50 {{ styles|get_item:key }} {{ class }}">{{ slot }}</button>
    {% endif %}
{% endwith %}
