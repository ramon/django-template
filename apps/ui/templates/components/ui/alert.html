{% comment %}
Alerta de página. `severity` (info/success/warning/error) decide cor de fundo e do ponto.
Não há token dedicado a success/warning — reaproveitam secondary/tertiary (ADR 0012).
{% endcomment %}
<c-vars severity="info" class="" :styles="{'info': 'bg-primary-container text-on-primary-container', 'success': 'bg-secondary-container text-on-secondary-container', 'warning': 'bg-tertiary-container text-on-tertiary-container', 'error': 'bg-error-container text-on-error-container'}" :dot="{'info': 'bg-primary', 'success': 'bg-secondary', 'warning': 'bg-tertiary', 'error': 'bg-error'}" />

<div role="alert"
     {{ attrs }}
     class="flex items-start gap-2 rounded-lg px-4 py-3 text-sm {{ styles|get_item:severity }} {{ class }}">
    <span class="mt-1.5 size-2 shrink-0 rounded-full {{ dot|get_item:severity }}"></span>
    <span>{{ slot }}</span>
</div>
