{% comment %}Etiqueta curta. `color` usa o mesmo mapeamento de tokens do <c-ui.alert>.{% endcomment %}
<c-vars color="neutral" class="" :colors="{'neutral': 'bg-surface-container-high text-on-surface-variant', 'primary': 'bg-primary-container text-on-primary-container', 'success': 'bg-secondary-container text-on-secondary-container', 'warning': 'bg-tertiary-container text-on-tertiary-container', 'danger': 'bg-error-container text-on-error-container'}" />

<span {{ attrs }}
      class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium {{ colors|get_item:color }} {{ class }}">{{ slot }}</span>
